<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Works | well1367</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050507;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.15);
      --text: #dcdcdc;
      --accent: #ff4d4d;
      --font-main: 'Inter', Arial, sans-serif;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      cursor: default;
    }

    .base-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.5;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      pointer-events: none;
    }

    .cursor-area {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      z-index: -1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
      box-shadow: 0 0 15px rgba(255, 165, 0, 0.15);
    }

    header {
      text-align: center;
      padding: 60px 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards 0.2s;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-family: var(--font-pixel);
      font-size: 36px;
      letter-spacing: 4px;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    p.subtitle {
      margin-top: 12px;
      font-family: var(--font-pixel);
      font-size: 16px;
      opacity: 0.8;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.95);
      animation: fadeInUp 0.8s ease forwards 0.6s;
      max-width: 960px;
      margin: 0 auto 50px auto;
      position: relative;
      z-index: 2;
    }

    .gallery-title {
      font-family: var(--font-pixel);
      font-size: 22px;
      margin-bottom: 20px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gallery-title .emoji {
      font-size: 28px;
      image-rendering: pixelated;
      line-height: 1;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    .item {
      border-radius: 12px;
      overflow: hidden;
      background: #121215;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.6s ease forwards;
      position: relative;
      border: 1px solid rgba(255,255,255,0.05);
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    /* Анимации появления карточек */
    .item:nth-child(1) { animation-delay: 0.7s; }
    .item:nth-child(2) { animation-delay: 0.8s; }
    .item:nth-child(3) { animation-delay: 0.9s; }
    .item:nth-child(4) { animation-delay: 1.0s; }
    .item:nth-child(5) { animation-delay: 1.1s; }
    .item:nth-child(6) { animation-delay: 1.2s; }
    .item:nth-child(7) { animation-delay: 1.3s; }
    .item:nth-child(8) { animation-delay: 1.4s; }

    .item:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(255, 77, 77, 0.25);
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated; /* Сохраняет четкость пикселей */
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 40px 20px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.4s;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .contact-link {
      font-family: var(--font-pixel);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      color: #dcdcdc;
      text-shadow: 0 0 4px rgba(255,255,255,0.1);
      transition: color 0.3s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .contact-link:hover {
      color: #ff4d4d;
      transform: scale(1.1);
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- СТИЛИ ДЛЯ УВЕЛИЧЕНИЯ (МОДАЛЬНОЕ ОКНО) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 7, 0.92); /* В тон твоему body */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: none; /* Скрыто по умолчанию */
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-image-container {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      padding: 4px;
      box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-image-container img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated; /* ГЛАВНОЕ: сохраняет пиксели четкими */
      filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.4));
    }

    .close-modal {
      position: absolute;
      top: -40px;
      right: 0;
      color: var(--text);
      font-family: var(--font-pixel);
      font-size: 24px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.3s;
      user-select: none;
    }

    .close-modal:hover {
      color: var(--accent);
      transform: scale(1.1);
    }

    @keyframes popIn {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="base-bg"></div>
  <div id="cursor-area" class="cursor-area"></div>

  <header>
    <h1>PIXEL ART WORKS</h1>
    <p class="subtitle">Автор well1367:3</p>
  </header>

  <main style="padding: 0 20px; flex: 1;">
    <div class="glass-panel">
      <h2 class="gallery-title">Мои работы <span class="emoji">🎨</span></h2>
      
      <div class="gallery">
        <!-- Карточки галереи -->
        <div class="item"><img src="images/art1.png" alt="Арт 1"></div>
        <div class="item"><img src="images/art2.png" alt="Арт 2"></div>
        <div class="item"><img src="images/art3.png" alt="Арт 3"></div>
        <div class="item"><img src="images/art4.png" alt="Арт 4"></div>
        <div class="item"><img src="images/art5.png" alt="Арт 5"></div>
        <div class="item"><img src="images/art6.png" alt="Арт 6"></div>
        <div class="item"><img src="images/art7.png" alt="Арт 7"></div>
        <div class="item"><img src="images/art8.png" alt="Арт 8"></div>
      </div>
    </div>
  </main>

  <footer>
    <a href="https://t.me/well1367" class="contact-link">Telegram:@well1367</a>
    <a href="mailto:bronislavrucinskij@gmail.com" class="contact-link">Email:bronislavrucinskij@gmail.com</a>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО (УВЕЛИЧЕНИЕ) -->
  <div id="zoomModal" class="modal-overlay">
    <div class="modal-image-container">
      <span class="close-modal" onclick="closeZoom()">закрыть </span>
      <img id="zoomImg" src="" alt="Full size art">
    </div>
  </div>

  <script>
    // --- ЛОГИКА УВЕЛИЧЕНИЯ КАРТИНОК ---
    const modal = document.getElementById('zoomModal');
    const modalImg = document.getElementById('zoomImg');

    // Находим все элементы галереи
    const items = document.querySelectorAll('.gallery .item');

    items.forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        if (img) {
          modalImg.src = img.src;
          modal.classList.add('active');
          document.body.style.overflow = 'hidden'; // Блокируем прокрутку страницы
        }
      });
    });

    function closeZoom() {
      modal.classList.remove('active');
      document.body.style.overflow = ''; // Возвращаем прокрутку
    }

    // Закрытие по клику на темный фон
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeZoom();
      }
    });

    // Закрытие по клавише Esc
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeZoom();
      }
    });

    // --- ТВОЙ СУЩЕСТВУЮЩИЙ КОД ДЛЯ КУРСОРА ---
    const area = document.getElementById('cursor-area');
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      area.style.left = x + 'px';
      area.style.top = y + 'px';
      area.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => {
      area.style.opacity = '0';
    });
  </script>
</body>
</html>
