<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Works | well1367</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0a0a0f;
      --text: #e8e8e8;
      --accent: #ff6b6b;
      --border: rgba(255, 255, 255, 0.12);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --font-main: 'Inter', Arial, sans-serif;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== ТВОИ ОБОИ ===== */
    .base-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;

      background-image: url("images/background.png");
      background-color: #0a0a0f;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Лёгкое затемнение, чтобы текст читался */
    .base-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.45);
    }

    /* ===== ПРИВЕТСТВИЕ ===== */
    .welcome {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      animation: welcomeFade 0.5s ease both;
    }

    .welcome.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    .welcome-box {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      padding: 20px;
      animation: welcomePop 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .welcome-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      image-rendering: pixelated;
    }

    .speech-bubble {
      position: relative;
      max-width: min(78vw, 360px);
      padding: 18px 22px;
      border-radius: 18px;
      background: #fff;
      color: #111;
      font-family: var(--font-pixel);
      font-size: clamp(13px, 3.4vw, 18px);
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      left: -14px;
      bottom: 22px;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 16px solid #fff;
    }

    .welcome-hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      color: #ddd;
      font-size: 13px;
      opacity: 0.75;
    }

    @keyframes welcomeFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes welcomePop {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== ОСНОВНОЙ САЙТ ===== */
    header {
      text-align: center;
      padding: clamp(40px, 8vw, 60px) 20px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: var(--font-pixel);
      font-size: clamp(24px, 6vw, 36px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.3;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .author {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      image-rendering: pixelated;
    }

    .subtitle {
      font-family: var(--font-pixel);
      font-size: clamp(12px, 3.5vw, 16px);
      opacity: 0.85;
    }

    main {
      flex: 1;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    .glass-panel {
      max-width: 960px;
      margin: 0 auto 50px;
      padding: clamp(20px, 5vw, 30px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
    }

    .gallery-title {
      font-family: var(--font-pixel);
      font-size: clamp(18px, 4.5vw, 22px);
      margin-bottom: 20px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(40vw, 160px), 1fr));
      gap: clamp(12px, 3vw, 18px);
    }

    .item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #14141a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .item:hover,
    .item:active {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(255, 107, 107, 0.22);
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .img-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      color: #aaa;
      font-size: 12px;
      background: #14141a;
    }

    footer {
      margin-top: auto;
      padding: clamp(30px, 6vw, 40px) 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
      z-index: 2;
    }

    .contact-link {
      font-family: var(--font-pixel);
      font-size: clamp(12px, 3vw, 14px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.08);
      transition: color 0.25s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .contact-link:hover,
    .contact-link:active {
      color: var(--accent);
      transform: scale(1.05);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 4vw, 20px);
      background: rgba(10, 10, 15, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-image-container {
      position: relative;
      width: 100%;
      max-width: min(90vw, 90vh);
      max-height: 90vh;
      padding: 4px;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.28);
    }

    .modal-image-container img {
      width: 100%;
      height: auto;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
    }

    .close-modal {
      position: absolute;
      top: -36px;
      right: 0;
      padding: 4px 8px;
      color: var(--text);
      font-family: var(--font-pixel);
      font-size: clamp(18px, 4vw, 24px);
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .close-modal:hover,
    .close-modal:active {
      color: var(--accent);
      transform: scale(1.05);
    }

    .mode-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-family: var(--font-pixel);
      font-size: clamp(12px, 3vw, 14px);
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .mode-toggle:hover,
    .mode-toggle:active {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.03);
      color: #fff;
    }

    /* ===== ЛЁГКАЯ ВЕРСИЯ ===== */
    body.lite-mode {
      background: #050508;
      background-image: none !important;
    }

    body.lite-mode .base-bg {
      display: none !important;
    }

    body.lite-mode .glass-panel {
      background: #101014 !important;
      border-color: #333 !important;
      border-radius: 8px !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    body.lite-mode h1,
    body.lite-mode .subtitle,
    body.lite-mode .gallery-title,
    body.lite-mode .contact-link,
    body.lite-mode .mode-toggle,
    body.lite-mode .close-modal {
      font-family: Arial, sans-serif !important;
      text-shadow: none !important;
    }

    body.lite-mode h1 {
      font-size: 22px !important;
    }

    body.lite-mode .subtitle {
      font-size: 14px !important;
    }

    body.lite-mode .author {
      gap: 10px;
    }

    body.lite-mode .avatar {
      width: 64px;
      height: 64px;
      border: 1px solid #444;
      box-shadow: none;
      image-rendering: auto;
    }

    body.lite-mode .gallery {
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
      gap: 10px !important;
    }

    body.lite-mode .item {
      border-radius: 6px !important;
      border-color: #333 !important;
      background: #111 !important;
      box-shadow: none !important;
      transform: none !important;
      transition: none !important;
    }

    body.lite-mode .item:hover,
    body.lite-mode .item:active {
      transform: none !important;
      box-shadow: none !important;
    }

    body.lite-mode .item img {
      image-rendering: auto !important;
    }

    body.lite-mode .modal-overlay {
      background: rgba(5, 5, 8, 0.92) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    body.lite-mode .modal-image-container {
      background: #111 !important;
      border-color: #444 !important;
      box-shadow: none !important;
    }

    body.lite-mode .modal-image-container img {
      image-rendering: auto !important;
    }

    body.lite-mode .mode-toggle {
      background: #222 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome,
      .welcome-box {
        animation: none !important;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="base-bg"></div>

  <!-- ПРИВЕТСТВИЕ -->
  <div class="welcome" id="welcome">
    <div class="welcome-box">
      <img
        class="welcome-avatar"
        src="avatar.png"
        alt="Аватар автора well1367"
      >

      <div class="speech-bubble">
        Добро пожаловать!
      </div>
    </div>

    <p class="welcome-hint">Нажми, чтобы войти</p>
  </div>

  <header>
    <h1>PIXEL ART WORKS</h1>

    <div class="author">
      <img
        class="avatar"
        src="avatar.png"
        alt="Аватар автора well1367"
        width="90"
        height="90"
      >
      <p class="subtitle">Автор well1367 (4,409ч в aseprite)</p>
    </div>
  </header>

  <main>
    <div class="glass-panel">
      <h2 class="gallery-title">Мои работы <span>🎨</span></h2>

      <div class="gallery" id="gallery"></div>
    </div>
  </main>

  <footer>
    <a href="https://t.me/well1367" class="contact-link">Telegram: @well1367</a>
    <a href="mailto:bronislavrucinskij@gmail.com" class="contact-link">Email: bronislavrucinskij@gmail.com</a>
  </footer>

  <div id="zoomModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
    <div class="modal-image-container">
      <span class="close-modal" id="closeModal">закрыть</span>
      <img id="zoomImg" alt="Просмотр арта">
    </div>
  </div>

  <button id="modeToggle" class="mode-toggle" type="button">Лёгкая версия</button>

  <script>
    const ART_COUNT = 15;

    const artFiles = Array.from({ length: ART_COUNT }, (_, index) => {
      return `images/art${index + 1}.png`;
    });

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('zoomModal');
    const modalImg = document.getElementById('zoomImg');
    const modeToggle = document.getElementById('modeToggle');
    const welcome = document.getElementById('welcome');
    const body = document.body;

    function closeWelcome() {
      welcome.classList.add('hidden');

      setTimeout(() => {
        welcome.remove();
      }, 500);
    }

    welcome.addEventListener('click', closeWelcome);
    setTimeout(closeWelcome, 4000);

    artFiles.forEach((src, index) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.dataset.src = src;

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Арт ${index + 1}`;
      img.loading = 'lazy';
      img.decoding = 'async';

      img.addEventListener('error', () => {
        console.error('Не удалось загрузить изображение:', img.src);

        item.innerHTML = `
          <div class="img-fallback">
            Не найден файл:<br>
            <strong>${src}</strong>
          </div>
        `;
      });

      item.appendChild(img);
      gallery.appendChild(item);
    });

    gallery.addEventListener('click', event => {
      const item = event.target.closest('.item');

      if (!item || !item.dataset.src) {
        return;
      }

      modalImg.src = item.dataset.src;
      modal.classList.add('active');
      body.style.overflow = 'hidden';
    });

    function closeZoom() {
      modal.classList.remove('active');
      modalImg.removeAttribute('src');
      body.style.overflow = '';
    }

    document.getElementById('closeModal').addEventListener('click', closeZoom);

    modal.addEventListener('click', event => {
      if (event.target === modal) {
        closeZoom();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeZoom();
      }
    });

    function updateToggleText() {
      modeToggle.textContent = body.classList.contains('lite-mode')
        ? 'Обычная версия'
        : 'Лёгкая версия';
    }

    modeToggle.addEventListener('click', () => {
      body.classList.toggle('lite-mode');
      updateToggleText();
    });

    updateToggleText();
  </script>
</body>
</html>
