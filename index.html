<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Works | well1367</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- СТИЛИ ВНУТРИ HTML (чтобы GitHub Pages их точно не потерял) -->
  <style>
    :root {
      --bg-color: #0f0f11;
      --glass-bg: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.25);
      --text: #e0e0e0;
      --accent: #ff4d4d;
      --font-main: 'Inter', Arial, sans-serif;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Пиксельный фон (сетка) */
    .pixel-bg::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards 0.2s;
    }

    h1 {
      font-family: var(--font-pixel);
      font-size: 36px;
      letter-spacing: 4px;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 2px rgba(255,255,255,0.4);
    }

    p.subtitle {
      margin-top: 12px;
      font-family: var(--font-pixel);
      font-size: 16px;
      opacity: 0.9;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: scale(0.95);
      animation: fadeInUp 0.8s ease forwards 0.6s;
      max-width: 960px;
      margin: 0 auto 60px auto;
    }

    .gallery-title {
      font-family: var(--font-pixel);
      font-size: 24px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }

    .item {
      border-radius: 20px;
      overflow: hidden;
      background: #1a1a1d;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.6s ease forwards;
    }

    /* Задержки для карточек */
    .item:nth-child(1) { animation-delay: 0.8s; }
    .item:nth-child(2) { animation-delay: 0.9s; }
    .item:nth-child(3) { animation-delay: 1.0s; }
    .item:nth-child(4) { animation-delay: 1.1s; }
    .item:nth-child(5) { animation-delay: 1.2s; }
    .item:nth-child(6) { animation-delay: 1.3s; }

    .item:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated; /* чтобы пиксели не мылились */
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.4s;
    }

    .contact-link {
      font-family: var(--font-pixel);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      color: #e0e0e0;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
      margin: 8px 0;
      display: inline-block;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .contact-link:hover {
      color: #ff4d4d;
      transform: scale(1.05);
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="pixel-bg"></div>

  <header>
    <h1>PIXEL ART WORKS</h1>
    <!-- ЗАМЕНИ [ТВОЁ ИМЯ] на своё имя -->
    <p class="subtitle">Автор: [ТВОЁ ИМЯ]</p>
  </header>

  <main style="padding: 0 20px;">
    <div class="glass-panel">
      <h2 class="gallery-title">Мои работы</h2>
      <div class="gallery">
        <!-- ЗАМЕНИ src="..." на пути к своим картинкам -->
        <div class="item"><img src="images/art1.png" alt="Арт 1" /></div>
        <div class="item"><img src="images/art2.png" alt="Арт 2" /></div>
        <div class="item"><img src="images/art3.png" alt="Арт 3" /></div>
        <div class="item"><img src="images/art4.png" alt="Арт 4" /></div>
        <div class="item"><img src="images/art5.png" alt="Арт 5" /></div>
        <div class="item"><img src="images/art6.png" alt="Арт 6" /></div>
      </div>
    </div>
  </main>

  <footer>
    <!-- ЗАМЕНИ t.me/твой_ник на свой реальный ник в Телеграме -->
    <a href="https://t.me/твой_ник" class="contact-link">Telegram: t.me/твой_ник</a>

    <!-- ЗАМЕНИ name@bronislavrucinskij.com на свой реальный Email -->
    <a href="mailto:name@bronislavrucinskij.com" class="contact-link">Email: написать мне</a>
  </footer>
</body>
</html>
